# GitHub Pages 자동 배포 워크플로
#
# 기본 브랜치 main에 푸시하면 빌드 후 GitHub Pages에 자동 배포합니다.
# GitHub Pages 환경(github-pages)은 기본 브랜치에서만 배포를 허용하므로,
# 트리거를 main으로 제한하고 deploy 잡에도 main 조건을 두어
# 다른 브랜치 푸시가 배포 단계에서 거부되는 일이 없도록 합니다.
#
# 이 워크플로는 configure-pages 단계에서 GitHub Pages를 자동으로 활성화하므로,
# 저장소 Settings에서 Pages Source를 수동으로 바꾸지 않아도 됩니다.
# (수동 설정이 필요하다면 Settings → Pages → Source를 "GitHub Actions"로 지정)

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 겹치지 않도록 함 (진행 중인 배포는 완료까지 기다림)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        # enablement: true → Pages가 꺼져 있으면 워크플로가 자동으로 켭니다.
        # 이 단계의 base_path 출력으로 저장소 이름에 맞는 base 경로를 얻습니다.
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Lint
        run: npm run lint

      - name: Build
        # configure-pages가 계산한 base_path(예: /newstory/)를 그대로 사용.
        # 저장소 이름이 바뀌어도 자동으로 맞춰집니다.
        run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # 기본 브랜치에서만 배포 (수동 실행을 다른 브랜치에서 하더라도 배포는 건너뜀)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
